<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Website - JS</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f5f9;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      color: #123456;
    }

    .content {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #dfe6ee;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      color: #334155;
    }

    input, select, button {
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }

    button {
      background: #123456;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #dfe6ee;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #e8f0fb;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Weekly Schedule</h1>

    <div class="content">
      <section class="card">
        <form id="schedule-form">
          <label>
            Date
            <input type="date" name="date" required>
          </label>

          <label>
            Start
            <input type="time" name="start" required>
          </label>

          <label>
            End
            <input type="time" name="end" required>
          </label>

          <label>
            Description
            <input type="text" name="description" placeholder="Example: Study" required>
          </label>

          <label>
            Place
            <input type="text" name="place" placeholder="Example: Library" required>
          </label>

          <label>
            Type
            <select name="type" required>
              <option value="Class">Class</option>
              <option value="Meeting">Meeting</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
            </select>
          </label>

          <label>
            Notes
            <input type="text" name="notes" placeholder="Optional notes">
          </label>

          <button type="submit">Add to schedule</button>
        </form>
      </section>

      <section class="card">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Start</th>
              <th>End</th>
              <th>Description</th>
              <th>Place</th>
              <th>Type</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="schedule-body">
            <tr>
              <td>2026-10-06</td>
              <td>09:00</td>
              <td>10:00</td>
              <td>Web Development</td>
              <td>Campus</td>
              <td>Class</td>
              <td>Final project review</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="./js/server.js"></script>
</body>
</html>
