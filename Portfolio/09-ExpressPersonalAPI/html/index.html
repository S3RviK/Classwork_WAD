<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express test</title>
</head>

<body>
    <% if (locals.error) { %>
        <h3>
            <%= error %>
        </h3>
        <% } %>
            <% if (locals.greeting) { %>
                <h2>
                    <%= greeting %>
                </h2>
                <% } %>
            <form action="/greet" method="get">
                Register:
                <input type="text" name="name" id="name" placeholder="Name">
                <input type="submit" value="go next">
            </form>

            <h2>Personas que saludé</h2>
            <ul>
                <% names.forEach((name, index) => { %>
                    <li><a href="/greet/<%= index %>"><%= name %></a></li>
                    <% }); %>
            </ul>

            <h2>TODO List</h2>
            <form action="/task" method="post">
                <label for="task">Nueva tarea:</label>
                <input type="text" name="task" id="task" placeholder="Escribe una tarea">
                <button type="submit">Agregar tarea</button>
            </form>
            <ul>
                <% tasks.forEach((task, index) => { %>
                    <li>
                        <%= task %>
                        <form action="/task/<%= index %>/delete" method="post" style="display: inline;">
                            <button type="submit">Eliminar</button>
                        </form>
                        <form action="/task/<%= index %>/move/up" method="post" style="display: inline;">
                            <button type="submit" <%= index === 0 ? "disabled" : "" %>>↑</button>
                        </form>
                        <form action="/task/<%= index %>/move/down" method="post" style="display: inline;">
                            <button type="submit" <%= index === tasks.length - 1 ? "disabled" : "" %>>↓</button>
                        </form>
                    </li>
                    <% }); %>
            </ul>
</body>

</html>
